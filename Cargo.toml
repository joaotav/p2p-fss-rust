[package]
name = "p2p-fss-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
clap = { version = "4.5.37", features = ["derive"] }
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
sha2 = "0.10.6"
uuid = { version = "1.3.0", features = ["v4", "serde"]}
base64 = "0.21.0"
rand = "0.8.5"

